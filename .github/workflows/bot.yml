name: Kripto Bot 7/24

on:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir çalıştırır
  workflow_dispatch: # İstediğimiz zaman elle test etmemiz için buton ekler

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Indir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: pip install -r requirements.txt

      - name: Botu Calistir
        run: scanner.py
